<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTHosting · Prototipo navegable</title>
<style>
:root{
  --ink:#17302C; --paper:#F4F6F3; --surface:#FFFFFF;
  --line:#E1E6E0; --line-2:#C7D0C6;
  --text:#17302C; --text-2:#5C6B65; --text-3:#8D9992;
  --brand:#0E6B57; --brand-bg:#E4EFEB;
  --warn:#9C6114; --warn-bg:#FAEFDD;
  --danger:#A03528; --danger-bg:#FAE9E6;
  --font-ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-ui);background:var(--paper);color:var(--text);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.topbar{height:46px;background:var(--ink);color:#EAF0EC;display:flex;align-items:center;
  justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:50}
.topbar .brand{font-weight:600;letter-spacing:.14em;font-size:11px}
.topbar .demo{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#8FA9A0}
.vp-toggle{display:flex;gap:2px;background:rgba(255,255,255,.1);border-radius:6px;padding:2px}
.vp-toggle button{padding:4px 12px;border-radius:4px;font-size:11px;color:#B7C9C2}
.vp-toggle button.on{background:#EAF0EC;color:var(--ink);font-weight:600}

.app{display:flex;min-height:calc(100vh - 46px)}
.side{width:196px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);padding:14px 8px}
.side a{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:var(--r);
  font-size:13px;color:var(--text-2);text-decoration:none;margin-bottom:1px;cursor:pointer}
.side a:hover{background:var(--paper)}
.side a.on{background:var(--brand-bg);color:var(--brand);font-weight:600}
.side .grp{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);
  padding:14px 11px 6px}
.side .dot{margin-left:auto;background:var(--danger);color:#fff;font-size:10px;font-weight:600;
  min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.main{flex:1;min-width:0;padding:22px 26px 60px}
.wrap{max-width:940px}

/* mobile frame */
body.mob .app{justify-content:center;background:#DDE3DD;padding:22px 0 40px}
body.mob .side{display:none}
body.mob .main{flex:0 0 390px;width:390px;background:var(--paper);border-radius:22px;
  padding:0 0 62px;overflow:hidden;box-shadow:0 8px 32px rgba(23,48,44,.16);position:relative;min-height:720px}
body.mob .wrap{max-width:none;padding:14px 14px 0}
.mnav{display:none}
body.mob .mnav{display:flex;position:absolute;bottom:0;left:0;right:0;height:58px;
  background:var(--surface);border-top:1px solid var(--line);border-radius:0 0 22px 22px}
.mnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;font-size:10px;color:var(--text-3)}
.mnav button.on{color:var(--brand);font-weight:600}
.mnav .ic{font-size:17px;line-height:1}
.mnav .mdot{position:absolute;top:8px;margin-left:16px;background:var(--danger);width:7px;height:7px;border-radius:4px}

/* ---------- type ---------- */
h1{font-size:19px;font-weight:600;letter-spacing:-.01em}
h2{font-size:15px;font-weight:600;margin-bottom:9px}
.lbl{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);font-weight:600}
.mono{font-family:var(--font-mono);font-size:12px}
.sub{color:var(--text-2);font-size:12.5px}
.mut{color:var(--text-3)}

/* ---------- pieces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.btn{border:1px solid var(--line-2);border-radius:var(--r);padding:6px 13px;font-size:12.5px;background:var(--surface)}
.btn:hover{border-color:var(--text-3)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:500}
.btn.pri:hover{background:#0B5849}
.tabs{display:flex;gap:4px}
.tabs button{padding:6px 13px;border-radius:var(--r);font-size:12.5px;color:var(--text-2)}
.tabs button.on{background:var(--surface);border:1px solid var(--line-2);font-weight:600;color:var(--text)}
.search{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:9px 13px;display:flex;align-items:center;gap:9px;color:var(--text-3);font-size:13px;width:100%}

.row{background:var(--surface);border-left:3px solid transparent;padding:12px 15px;
  border-bottom:1px solid var(--line);cursor:pointer;display:block;width:100%;text-align:left}
.row:last-child{border-bottom:none}
.row:hover{background:#FAFBFA}
.row.dg{border-left-color:var(--danger)}
.sec-in .row{border-left-color:var(--brand)}
.sec-in .row.dg{border-left-color:var(--danger)}
.sec-out .row{border-left-color:#B8862E}
.sec-out .row.dg{border-left-color:var(--danger)}
.sec-head{display:flex;align-items:center;gap:8px;margin-bottom:9px;font-weight:600;font-size:15px}
.sec-head.in{color:var(--brand)}
.sec-head.out{color:#8A6420}
.sec-head .pill{width:9px;height:9px;border-radius:5px}
.sec-head.in .pill{background:var(--brand)}
.sec-head.out .pill{background:#B8862E}
.tabs button.in.on{border-color:var(--brand);color:var(--brand);background:var(--brand-bg)}
.tabs button.out.on{border-color:#B8862E;color:#8A6420;background:#F7EFDF}
.row.wn{border-left-color:var(--warn)}
.row.nt{border-left-color:var(--line-2)}
.r1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.r1 strong{font-size:13.5px;font-weight:600}
.r2{margin-top:3px;font-size:12.5px;color:var(--text-2)}

.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:5px;
  background:var(--paper);color:var(--text-2);white-space:nowrap}
.tag.br{background:var(--brand-bg);color:var(--brand)}
.tag.wn{background:var(--warn-bg);color:var(--warn)}
.tag.dg{background:var(--danger-bg);color:var(--danger)}
.tag.ok{background:var(--brand-bg);color:var(--brand)}
.tag.gh{background:none;border:1px dashed var(--line-2);color:var(--text-3)}

.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.stat .n{font-size:22px;font-weight:600;margin-top:1px;letter-spacing:-.02em}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px}

.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--paper)}
.bar i{display:block}
.bar .a{background:var(--brand)}
.bar .u{background:var(--danger)}
.bar .w{background:var(--warn)}
.bar .g{background:var(--line-2)}

.sel{position:relative}
.selbtn{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
  padding:7px 11px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
.selbtn.empty{border:1.5px dashed var(--warn);color:var(--warn);background:var(--warn-bg);font-weight:500}
.selbtn.urg{border-color:var(--danger)!important;color:var(--danger)!important;background:var(--danger-bg)!important}
.pop{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 4px);background:var(--surface);
  border:1px solid var(--line-2);border-radius:10px;box-shadow:0 10px 28px rgba(23,48,44,.15);
  max-height:262px;overflow:auto}
.pop .ph{padding:7px 12px 3px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-3);font-weight:600}
.pop button{display:block;width:100%;text-align:left;padding:7px 12px;font-size:13px}
.pop button:hover{background:var(--paper)}
.pop .sp{border-top:1px solid var(--line);margin-top:4px}

.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:13px}
.kv+.kv{border-top:1px solid var(--line)}
.sec{padding:13px 15px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:none}

.ov{position:fixed;inset:0;background:rgba(23,48,44,.4);z-index:100;display:flex;
  justify-content:flex-end}
body.mob .ov{justify-content:center;align-items:center}
.dw{background:var(--surface);width:412px;max-width:100%;overflow-y:auto;height:100%}
body.mob .dw{width:390px;height:720px;border-radius:22px}
.dwh{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);
  padding:12px 15px;display:flex;align-items:center;gap:10px;z-index:2}

.note{background:var(--warn-bg);border-left:3px solid var(--warn);padding:10px 14px;
  border-radius:0 var(--r) var(--r) 0;font-size:12.5px;color:var(--warn)}
.note.dg{background:var(--danger-bg);border-color:var(--danger);color:var(--danger)}
.note.ok{background:var(--brand-bg);border-color:var(--brand);color:var(--brand)}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);
  padding:9px 12px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}

.dayh{display:flex;justify-content:space-between;align-items:center;margin:18px 0 7px}
.dayh h2{margin:0}
.drop{cursor:pointer}
.hidden{display:none}
.pend{border:1.5px dashed var(--warn)!important;background:var(--warn-bg)!important;
  color:var(--warn)!important;font-weight:500}
.pend.urg{border-color:var(--danger)!important;background:var(--danger-bg)!important;color:var(--danger)!important}
.falta{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 9px;border-radius:5px;
  background:var(--warn-bg);color:var(--warn);border:1px dashed var(--warn);font-weight:500;white-space:nowrap}
.falta.urg{background:var(--danger-bg);color:var(--danger);border-color:var(--danger)}
.todo{background:var(--warn-bg);border-left:3px solid var(--warn);border-radius:0 var(--r) var(--r) 0;
  padding:11px 14px;margin-bottom:2px}
.todo.urg{background:var(--danger-bg);border-color:var(--danger)}
.todo ul{margin:6px 0 0 16px;font-size:12.5px}
.todo li{margin-bottom:2px}
.help{display:flex;gap:7px;align-items:flex-start;background:#EEF3F7;border-radius:var(--r);
  padding:8px 11px;font-size:12px;color:#456;margin-top:8px}
.help .i{font-size:13px;flex-shrink:0;margin-top:1px}
.selfmsg{background:var(--brand-bg);border-radius:var(--r);padding:9px 12px;font-size:12.5px;
  color:var(--brand);margin-top:8px;display:flex;gap:7px;align-items:flex-start}
.selfmsg.wn{background:var(--warn-bg);color:var(--warn)}
.selfmsg.dg{background:var(--danger-bg);color:var(--danger)}
.chk{width:20px;height:20px;border:1.5px solid var(--line-2);border-radius:5px;flex-shrink:0;
  display:grid;place-items:center;cursor:pointer;font-size:13px;background:var(--surface)}
.chk.on{background:var(--brand);border-color:var(--brand);color:#fff}
.invrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.invrow:first-child{border-top:none}
.invrow .nm{flex:1;font-size:13px}
.invrow input.det{flex:1;border:1px solid var(--line);border-radius:6px;padding:5px 9px;font:inherit;font-size:12px;background:var(--paper)}
.numsel{display:flex;align-items:center;gap:8px}
.numsel button{width:26px;height:26px;border:1px solid var(--line-2);border-radius:6px;font-size:15px;background:var(--surface)}
.numsel .v{min-width:20px;text-align:center;font-weight:600}
.acc{border-bottom:1px solid var(--line)}
.acc:last-child{border-bottom:none}
.acc-h{width:100%;display:flex;align-items:center;justify-content:space-between;
  padding:12px 15px;text-align:left;background:var(--paper);border-left:3px solid var(--brand)}
.acc-h:hover{background:var(--paper)}
.acc-h{background:var(--surface-1,#F4F6F3)}
.acc-h .tt{font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink)}
.acc-h .ch{font-size:15px;color:var(--text-3);transition:transform .15s}
.acc-h.open{background:var(--brand-bg)}
.acc-h.open .ch{transform:rotate(90deg)}
.acc-b{padding:0 15px 14px}
.acc-sum{font-size:12px;color:var(--text-3);margin-left:8px;font-weight:400}
.vent{margin-top:6px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;
  font-size:12.5px;background:var(--paper);border-radius:6px;padding:6px 10px}
.vent .lbl{margin-right:3px}
input[type=time].vacio{border:1.5px dashed var(--warn);background:var(--warn-bg);color:var(--warn)}
input[type=time]{font:inherit;font-size:13px;border:1px solid var(--line);
  border-radius:var(--r);padding:6px 10px;background:var(--paper);width:100%}
input[type=time]:focus{outline:2px solid var(--brand);outline-offset:1px;background:var(--surface)}
.ta{width:100%;min-height:62px;border:1px solid var(--line);border-radius:var(--r);
  padding:9px 11px;font:inherit;font-size:13px;background:var(--paper);resize:vertical}
.ta:focus{outline:2px solid var(--brand);outline-offset:1px;background:var(--surface)}
.mt{margin-top:16px}.mt2{margin-top:22px}.mb{margin-bottom:12px}
.flexb{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style>
</head>

function scAlertas(){
  // Las alertas se calculan del estado actual: al resolver algo, desaparecen solas.
  const sinResp = [];
  Object.keys(LIMPIEZAS).forEach(dia=>{
    LIMPIEZAS[dia].forEach(l=>{
      if(!l.resp){
        const d = SEMANA.find(x=>x.f===dia);
        sinResp.push([l.dp, (dia==='20'?'Mañana':d.fecha) + (l.urg?' · urgente, entra huésped el mismo día':''),
                      'Asignar', "irA('limp',{day:'"+dia+"'})"]);
      }
    });
  });

  const ventana = LLEGADAS.filter(ventanaMala).map((r)=>{
    const i = LLEGADAS.indexOf(r);
    return [r.dp, 'Sale '+r.prev.h+' y entra '+r.h+' el mismo día. Ventana: '+(ventanaTxt(r)||'sin margen'),
            'Ver llegada', "S.tab='llegadas';irA('inout');openDw('ci',"+i+")"];
  });

  const sinHora = LLEGADAS.filter(r=>!r.h||!r.acc).map(r=>{
    const i = LLEGADAS.indexOf(r);
    const q = [!r.h?'sin horario':null, !r.acc?'sin responsable':null].filter(Boolean).join(' y ');
    return [r.dp+' · '+r.g, 'Llegada '+q, 'Coordinar', "S.tab='llegadas';irA('inout');openDw('ci',"+i+")"];
  });

  const lates = SALIDAS.map((r,i)=>[r,i]).filter(([r])=>r.late && r.est.indexOf('entrada el mismo día')>-1)
    .map(([r,i])=>[r.dp, 'Late check-out y entrada el mismo día. No se puede limpiar',
                   'Ver check-out', "S.tab='salidas';irA('inout');openDw('co',"+i+")"]);

  const sd = SINDEPTO.map(r=>[r.anuncio, r.cod+' · '+r.ci+' → '+r.co, 'Asignar depto', "S.imported=true;irA('import')"]);

  const A = [
    {t:'Ventana insuficiente', c:'dg',
     nota:'Salida y entrada el mismo día sin tiempo material para limpiar.', items:ventana},
    {t:'Late check-out con entrada el mismo día', c:'dg',
     nota:'El huésped se va tarde y entra otro ese día. Requiere decisión.', items:lates},
    {t:'Llegadas sin coordinar', c:'dg',
     nota:'Falta horario o responsable para recibir al huésped.', items:sinHora},
    {t:'Limpiezas sin responsable', c:'dg',
     nota:'La limpieza existe pero todavía nadie la va a hacer.', items:sinResp},
    {t:'Reservas sin departamento', c:'wn',
     nota:'El anuncio no coincide con ningún departamento. Se mapea una vez y nunca más.', items:sd},
    {t:'Conflictos de cancelación', c:'wn',
     nota:'Se canceló una reserva y la limpieza necesita una decisión.',
     items:[['ED TALC 10','Estadía en curso cancelada. Falta la fecha real de salida','Ver reserva',"irA('inout')"]]}
  ];
  const tot = A.reduce((a,g)=>a+g.items.length,0);
  return `
  <div class="hdr"><div><h1>Alertas</h1>
    <p class="sub">${tot?tot+' pendientes de decisión · al resolverlas desaparecen solas':'Sin pendientes. Todo en orden.'}</p></div></div>
  ${tot===0?`<div class="note ok">No hay nada que requiera atención en este momento.</div>`:''}
  ${A.filter(g=>g.items.length).map(g=>`
    <div class="dayh"><h2>${g.t}</h2><span class="tag ${g.c}">${g.items.length}</span></div>
    <p class="sub mb">${g.nota}</p>
    <div class="card">
      ${g.items.map(([a,b,cta,fn])=>`
        <button class="row ${g.c==='dg'?'dg':'wn'}" onclick="${fn}">
          <div class="r1"><strong>${esc(a)}</strong>
            <span class="tag ${g.c}">${cta} ›</span></div>
          <div class="r2">${esc(b)}</div>
        </button>`).join('')}
    </div>`).join('')}`;
}

function contarAlertas(){
  let n = 0;
  Object.keys(LIMPIEZAS).forEach(d=>{ n += LIMPIEZAS[d].filter(l=>!l.resp).length; });
  n += LLEGADAS.filter(ventanaMala).length;
  n += LLEGADAS.filter(r=>!r.h||!r.acc).length;
  n += SINDEPTO.length + 1;
  n += SALIDAS.filter(r=>r.late && r.est.indexOf('entrada el mismo día')>-1).length;
  return n;
}

function requiereDejar(acc){
  if(!acc) return false;

function selfMsg(depto, pax){
  const d = DX(depto);
  if(d.self==='siempre') return {c:'', t:'Self habilitado. El huésped deja las llaves adentro y sale.'};
  if(d.self==='no') return {c:'dg', t:'Este departamento NO permite self check-out. Asigná un responsable o punto de acceso.'};
  if(pax>=2) return {c:'', t:'Self habilitado (2+ huéspedes). Instrucción: bajan, abren la puerta, uno sube a dejar las llaves y baja.'};
  return {c:'wn', t:'Self con aviso: la reserva es de 1 huésped. Con una sola persona puede quedar trabada afuera al dejar la llave adentro. Confirmá antes de usar self.'};
}

function juegos(d){
  const i = d.inv, n = v => v ? parseInt(v) || 0 : 0;
  const camas = [];
  if(n(i.king)) camas.push(n(i.king)+' juego'+(n(i.king)>1?'s':'')+' king');
  if(n(i.queen)) camas.push(n(i.queen)+' juego'+(n(i.queen)>1?'s':'')+' queen');
  if(n(i.twin)) camas.push(n(i.twin)+' juego'+(n(i.twin)>1?'s':'')+' twin');
  if(n(i.sillon)) camas.push(n(i.sillon)+' juego sillón cama');
  const banos = ['bano1','bano2','bano3'].filter(k=>invEstado(i[k])).length;
  return {camas, banos, toallas:d.cap};
}

    <div class="flexb" style="gap:6px">
      <button class="btn" onclick="alert('Semana anterior')">‹</button>
      <div class="selbtn" style="cursor:default;min-width:210px;justify-content:center">
        Vie 18/07 → Jue 24/07</div>
      <button class="btn" onclick="alert('Semana siguiente')">›</button>
    </div>
    <button class="btn" onclick="alert('Elegí un rango de fechas cualquiera para una excepción.')">Rango libre</button>
  </div>
  <div class="help mb"><span class="i">ℹ</span><span>La semana de pago va de viernes a jueves. Se paga el viernes lo hecho en ese período. Para casos especiales, usá «Rango libre».</span></div>

  <div class="grid3 mb">
    <div class="stat"><div class="lbl">Limpiezas</div><div class="n">${tot.lm}</div></div>
    <div class="stat"><div class="lbl">Personas activas</div><div class="n">${EQUIDAD.length}</div></div>
    <div class="stat"><div class="lbl">Promedio c/u</div><div class="n">${prom.toFixed(1)}</div></div>
  </div>

  <div class="card mb">
    ${EQUIDAD.slice().sort((a,b)=>b.lm-a.lm).map(x=>{
      const desv = x.lm - prom;
      const col = desv>=2?'var(--warn)':desv<=-2?'var(--text-accent)':'var(--brand)';
      return `<div class="sec">
        <div style="display:flex;align-items:center;gap:12px">
          <span style="width:74px;font-weight:600;font-size:13px;flex-shrink:0">${x.p}</span>
          <div style="flex:1;min-width:0">
            <div style="background:var(--paper);border-radius:5px;height:9px;overflow:hidden">
              <div style="height:100%;width:${x.lm/maxLm*100}%;background:${col}"></div>
            </div>
          </div>
          <span style="width:30px;text-align:right;font-weight:600;font-size:13px">${x.lm}</span>
        </div>
        <div class="flexb" style="margin-top:7px;margin-left:86px;gap:6px">
          <span class="tag">${x.amb} ambientes</span>
          <span class="tag">${money(x.$)}</span>
          ${Object.entries(x.zonas).map(([z,n])=>`<span class="tag" style="font-size:10px">${z} ${n}</span>`).join('')}
        </div>
      </div>`;
    }).join('')}
  </div>
  <div class="help"><span class="i">ℹ</span><span>La barra muestra cantidad de limpiezas. Verde: cerca del promedio · Ámbar: bastante por encima · Azul: por debajo. Los ambientes y las zonas ayudan a repartir según esfuerzo y traslado, no solo cantidad.</span></div>`;
}

/* ============ RENDER ============ */
function render(){
  // sidebar
  side.innerHTML = NAV.map(n => n.g
    ? `<div class="grp">${n.g}</div>`
    : `<a class="${S.screen===n.id?'on':''}" onclick="go('${n.id}')" tabindex="0">
         <span style="width:15px;text-align:center">${n.ic}</span>${n.t}
         ${n.badge?`<span class="dot">${contarAlertas()}</span>`:''}</a>`).join('');

  mnav.innerHTML = MNAV.map(n=>`
    <button class="${S.screen===n.id?'on':''}" onclick="go('${n.id}')" style="position:relative">
      <span class="ic">${n.ic}</span>${n.t}
      ${n.badge&&contarAlertas()?`<span class="mdot"></span>`:''}</button>`).join('');

  const F = {dash:scDashboard, calidad:scCalidad, equidad:scEquidad, hoy:scHoy, inout:scInOut, limp:scLimp, mislimp:scMisLimpiezas, alertas:scAlertas, accesos:scAccesos,
             deptos:scDeptos, import:scImport, export:scExport, config:scConfig};
  view.innerHTML = (F[S.screen]||scHoy)();

  overlay.innerHTML = '';
  if(S.drawer){
    const {k,i} = S.drawer;
    const body = k==='ci'?dwCheckin(i) : k==='co'?dwCheckout(i) : dwDepto(i);
    overlay.innerHTML = `<div class="ov" onclick="if(event.target===this)closeDw()">
      <div class="dw">${body}</div></div>`;
  }
}
document.addEventListener('click',()=>{ if(S.pop){ S.pop=null; render(); } });
render();
</script>
</body>
</html>
